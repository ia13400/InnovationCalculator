name: Repair stale Pages deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact stale resource to repair
        type: choice
        required: true
        default: workflow
        options:
          - workflow
          - pages

# Each independent repair receives only its required repository permission.
permissions: {}

concurrency:
  group: repair-pages-d8395f5
  cancel-in-progress: false

jobs:
  cancel-orphaned-workflow:
    if: >-
      github.repository == 'ia13400/InnovationCalculator' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'workflow'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force-cancel only the identified orphaned workflow
        uses: actions/github-script@v8
        with:
          debug: false
          retries: 0
          script: |
            const target = {
              owner: "ia13400",
              repo: "InnovationCalculator",
              run_id: 42086866797,
              request: { timeout: 10000 }
            };
            const expectedRepository = "ia13400/InnovationCalculator";
            const expectedSha = "d8395f5307f90a864df3eb62c0c8082547251b41";
            const runRoute = "GET /repos/{owner}/{repo}/actions/runs/{run_id}";
            const readRun = async () => {
              const { data } = await github.request(runRoute, target);
              if (
                data.id !== target.run_id ||
                data.repository?.full_name !== expectedRepository ||
                data.head_sha !== expectedSha ||
                data.head_branch !== "main"
              ) {
                throw new Error("Workflow identity guard failed; refusing to act.");
              }
              return data;
            };
            const before = await readRun();
            core.info(
              `Run ${target.run_id}: status=${before.status}, ` +
              `conclusion=${before.conclusion ?? "none"}, attempt=${before.run_attempt}`
            );
            if (before.status === "completed") {
              core.notice("The exact old workflow is already completed; no cancellation sent.");
              return;
            }
            if (!["queued", "in_progress", "waiting", "pending", "requested"].includes(before.status)) {
              core.setFailed("Unexpected workflow status; no cancellation sent.");
              return;
            }

            // Normal UI cancellation of this exact run has already failed twice.
            let cancelStatus;
            try {
              const response = await github.request(
                "POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel",
                target
              );
              cancelStatus = response.status;
              if (cancelStatus !== 202) {
                core.setFailed(`Unexpected force-cancel response: HTTP ${cancelStatus}`);
                return;
              }
              core.notice("Force-cancel accepted: HTTP 202.");
            } catch (error) {
              if (error.status !== 409) throw error;
              cancelStatus = 409;
              core.warning("Force-cancel returned HTTP 409; checking the run without retrying the POST.");
            }

            for (let attempt = 1; attempt <= 6; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const after = await readRun();
              core.info(
                `Readback ${attempt}/6: status=${after.status}, ` +
                `conclusion=${after.conclusion ?? "none"}`
              );
              if (after.status === "completed") {
                core.notice(`Verified completed workflow; conclusion=${after.conclusion ?? "none"}.`);
                return;
              }
            }
            core.setFailed(
              `Force-cancel returned HTTP ${cancelStatus}, but the old workflow ` +
              "did not become completed within 30 seconds. No further cancellation was attempted."
            );

  cancel-stale-deployment:
    if: >-
      github.repository == 'ia13400/InnovationCalculator' &&
      github.ref == 'refs/heads/main' &&
      inputs.target == 'pages'
    permissions:
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the identified stale deployment
        uses: actions/github-script@v8
        with:
          debug: false
          retries: 0
          script: |
            const target = {
              owner: "ia13400",
              repo: "InnovationCalculator",
              deploymentId: "d8395f5307f90a864df3eb62c0c8082547251b41",
              request: { timeout: 10000 }
            };
            const terminal = new Set([
              "succeed",
              "deployment_failed",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost"
            ]);
            const statusRoute =
              "GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}";
            const cancelRoute =
              "POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel";

            const before = await github.request(statusRoute, target);
            const initial = before.data?.status;
            core.info(`Pages status before cancellation: ${initial ?? "(missing)"}`);
            if (terminal.has(initial)) {
              core.notice("Deployment is already terminal; no cancellation sent.");
              return;
            }
            if (typeof initial !== "string" || initial.length === 0) {
              core.setFailed("Missing deployment status; no cancellation sent.");
              return;
            }

            const response = await github.request(cancelRoute, target);
            if (response.status !== 204) {
              core.setFailed(`Unexpected cancel response: HTTP ${response.status}`);
              return;
            }
            core.notice("Cancellation request returned HTTP 204.");
            for (let attempt = 1; attempt <= 6; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let after;
              try {
                after = await github.request(statusRoute, target);
              } catch (error) {
                if (error.status === 404) {
                  core.notice(
                    "Cancel returned 204; deployment status now returns 404. " +
                    "A fresh deployment must verify that the block is cleared."
                  );
                  return;
                }
                throw error;
              }
              const status = after.data?.status;
              core.info(`Readback ${attempt}/6: ${status ?? "(missing)"}`);
              if (terminal.has(status)) {
                core.notice(`Verified terminal Pages status: ${status}`);
                return;
              }
            }
            core.setFailed(
              "Cancellation was accepted, but no terminal status was observed " +
              "within 30 seconds. No further cancellation was attempted."
            );
